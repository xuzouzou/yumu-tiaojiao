name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          latest=$(ls /Applications | grep -E '^Xcode_[0-9]' | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "/Applications/$latest/Contents/Developer"
          xcodebuild -version
      - name: Build app (unsigned)
        run: |
          xcodebuild build -project YuMuTiaoJiu.xcodeproj -scheme YuMuTiaoJiu -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/YuMuTiaoJiu.app Payload/
          zip -r YuMuTiaoJiu-unsigned.ipa Payload
          ls -la YuMuTiaoJiu-unsigned.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YuMuTiaoJiu-unsigned-ipa
          path: YuMuTiaoJiu-unsigned.ipa
          retention-days: 90
